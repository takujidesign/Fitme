# Fixmee web app on Cloudflare (static files from ../app, stamped by deploy.mjs).
name = "fixmee-web"
compatibility_date = "2026-09-01"
workers_dev = false
main = "./worker.js"

[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"
# Only page URLs reach worker.js, for the www redirect; scripts, styles and images are served directly.
run_worker_first = ["/", "/en/*", "/zh/*", "/ja/*", "/vi/*", "/exercises/*", "/features/*", "/guide", "/privacy", "/terms", "/robots.txt", "/sitemap.xml"]

[[routes]]
pattern = "fixmee.app"
custom_domain = true

[[routes]]
pattern = "www.fixmee.app"
custom_domain = true
