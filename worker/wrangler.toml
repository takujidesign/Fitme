name = "fitme-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[vars]
VAPID_SUBJECT = "mailto:replace-with-your-email@example.com"
# Comma-separated origins allowed to call the API (your GitHub Pages URL).
ALLOWED_ORIGINS = "https://takujidesign.github.io"
# Optional: only accept slips paid to this receiver name (match any of "|"-separated parts).
RECEIVER_NAME = ""
# THUNDER_API_URL = "https://api.thunder.in.th/v2/verify/bank"

# Secrets (set with `npx wrangler secret put NAME`):
#   TOKEN_SECRET       random 32+ character string used to sign entitlement tokens
#   THUNDER_API_KEY    Thunder Solution API key (slip verification)
#   STRIPE_SECRET_KEY  Stripe secret key (sk_live_... or sk_test_...)
#   ANTHROPIC_API_KEY  Claude API key (supplement label reading)

# Optional extra replay protection for slips:
# [[kv_namespaces]]
# binding = "SLIPS"
# id = "<your KV namespace id>"

# Admin settings (create a namespace, then uncomment all three lines):
# [[kv_namespaces]]
# binding = "CONFIG"
# id = "<your CONFIG KV namespace id>"
# Secret: ADMIN_PASSWORD (npx wrangler secret put ADMIN_PASSWORD)

# Web Push: create PUSH KV and uncomment the binding below before enabling clients.
# npx wrangler kv namespace create PUSH
# [[kv_namespaces]]
# binding = "PUSH"
# id = "<your PUSH KV namespace id>"
# Secrets: VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY (generate once; keep stable).
# Cron is a no-op until PUSH and VAPID secrets are configured.
[triggers]
crons = ["*/5 * * * *"]
