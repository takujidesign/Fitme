name = "fitme-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
# Keep the old workers.dev URL working while clients move to api.fixmee.app.
workers_dev = true

[vars]
DEPLOY_SHA = "dev"
# Contact for Web Push services (the admin contact email, when set, is used instead).
VAPID_SUBJECT = "https://fixmee.app"
# Comma-separated origins allowed to call the API (your GitHub Pages URL).
ALLOWED_ORIGINS = "https://fixmee.app,https://www.fixmee.app,https://takujidesign.github.io"
# Optional: only accept slips paid to this receiver name (match any of "|"-separated parts).
RECEIVER_NAME = ""
# THUNDER_API_URL = "https://api.thunder.in.th/v2/verify/bank"

# Bootstrap secrets (set once with `npx wrangler secret put NAME`):
#   ADMIN_PASSWORD, TOKEN_SECRET, MASTER_KEY
# Service keys (Thunder, Stripe, Claude, VAPID, LINE, Resend) can be entered
# encrypted from the admin page instead of as Wrangler secrets.

[[kv_namespaces]]
binding = "CONFIG"
id = "48dafc31967c42a096b2e04dd1a29a8b"

[[kv_namespaces]]
binding = "PUSH"
id = "a3634425dcd84272bdcc6ab927f53715"

[[kv_namespaces]]
binding = "SLIPS"
id = "4826cc4973fa422f89e0899a6e7c364f"

[[d1_databases]]
binding = "DB"
database_name = "fixme"
database_id = "95ad7dff-0e0c-490f-b25a-976868548548"
migrations_dir = "migrations"

[triggers]
# */5: reminders and win-back; 20:00 UTC = 03:00 Asia/Bangkok nightly backup.
crons = ["*/5 * * * *", "0 20 * * *"]

# R2: exercise videos (admin uploads) and private nightly backups.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "fixme-media"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "fixme-backups"

# Public API hostname (Cloudflare creates the DNS record and certificate).
[[routes]]
pattern = "api.fixmee.app"
custom_domain = true

[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "Conversation"

[[migrations]]
tag = "round11-conversations"
new_sqlite_classes = ["Conversation"]
