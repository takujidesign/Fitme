<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Fixmee illustration review</title><style>body{font:16px system-ui;margin:24px;background:#f4f5f7;color:#17202d}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}article{background:white;padding:16px;border-radius:12px}.pair{display:flex}.pair img{width:50%}button{padding:12px;margin:4px;border:1px solid #778;border-radius:8px;cursor:pointer}output{display:block;padding:8px}</style><h1>Illustration review</h1><p>Check pose, equipment, anatomy and target muscles before approval. Only approved pairs enter the app manifest. Regenerate removes approval and queues the pair.</p><main></main><output role="status"></output><script type="module">
const token='__TOKEN__',main=document.querySelector('main'),status=document.querySelector('output');
async function load(){const response=await fetch('/pairs');const rows=await response.json();main.replaceChildren();for(const row of rows){const card=document.createElement('article'),title=document.createElement('h2');title.textContent=row.id+(row.approved?' ?':'');card.append(title);const pair=document.createElement('div');pair.className='pair';for(const pose of ['start','finish']){const img=document.createElement('img');img.src='/img/'+row.id+'-'+pose+'.webp';img.alt=pose;img.loading='lazy';pair.append(img);}card.append(pair);for(const decision of ['approve','regenerate','reject']){const button=document.createElement('button');button.textContent=decision;button.onclick=async()=>{button.disabled=true;try{const r=await fetch('/decision',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify({id:row.id,decision})});const result=await r.json();if(!r.ok)throw Error(result.error);status.textContent=row.id+': '+decision;await load();}catch(e){status.textContent=e.message;}finally{button.disabled=false;}};card.append(button);}main.append(card);}if(!rows.length)main.textContent='No generated pairs yet.';}
load().catch(e=>status.textContent=e.message);
</script></html>
