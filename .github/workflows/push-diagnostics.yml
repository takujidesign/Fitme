name: Push diagnostics
# Counts push-subscribed devices and when reminders were last delivered. Prints no endpoints, keys or user data.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Summarise devices
        shell: bash
        run: |
          id=$(grep -A2 'binding = "PUSH"' wrangler.toml | grep -o '[0-9a-f]\{32\}')
          npx wrangler kv key list --namespace-id "$id" --remote --prefix device: > "$RUNNER_TEMP/keys.json"
          node -e "const k=require(process.env.RUNNER_TEMP+'/keys.json');console.log('devices:',k.length)"
          for name in $(node -e "for(const k of require(process.env.RUNNER_TEMP+'/keys.json'))console.log(k.name)"); do
            npx wrangler kv key get "$name" --namespace-id "$id" --remote 2>/dev/null | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const r=JSON.parse(s);const sent=Object.values(r.lastSent||{});const last=sent.length?new Date(Math.max(...sent)).toISOString():'never';
              const host=(()=>{try{return new URL(r.subscription.endpoint).host}catch{return '?'}})();
              console.log('device', '| push service:',host,'| tz:',r.tz,'| reminders:',(r.reminders||[]).length,'| deliveries:',sent.length,'| last delivered:',last,'| expires:',new Date(r.expires).toISOString(),'| last error:',r.lastError?JSON.stringify(r.lastError):'none');}catch{console.log('device | unreadable')}})"
          done
          rm -f "$RUNNER_TEMP/keys.json"
