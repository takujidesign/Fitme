name: Admin login diagnostics
# Reports only whether admin login settings exist. Never prints secret values.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Worker secrets present
        shell: bash
        run: |
          names=$(npx wrangler secret list --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).map(x=>x.name).join(' ')))")
          for n in ADMIN_PASSWORD ADMIN_TOTP_SECRET TOKEN_SECRET MASTER_KEY; do
            if [[ " $names " == *" $n "* ]]; then echo "$n: set"; else echo "$n: not set"; fi
          done
      - name: Admin 2FA saved from the admin page
        shell: bash
        run: |
          id=$(grep -A2 'binding = "CONFIG"' wrangler.toml | grep -o '[0-9a-f]\{32\}')
          npx wrangler kv key get secrets --namespace-id "$id" --remote 2>/dev/null > "$RUNNER_TEMP/s.json" || echo '{}' > "$RUNNER_TEMP/s.json"
          node -e "let j={};try{j=JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP+'/s.json','utf8'))}catch{}console.log('adminTotpSecret (admin page 2FA):', j.adminTotpSecret ? 'set' : 'not set')"
          rm -f "$RUNNER_TEMP/s.json"
          rb=$(npx wrangler kv key get admin-revoked-before --namespace-id "$id" --remote 2>/dev/null || true)
          if [[ -n "$rb" && "$rb" =~ ^[0-9]+$ ]]; then echo "admin sessions revoked at: $(date -u -d @$((rb/1000)))"; else echo "admin sessions revoked at: never"; fi
      - name: Account data counts (no personal data)
        shell: bash
        run: |
          npx wrangler d1 execute fixme --remote --json --command "SELECT (SELECT count(*) FROM users) AS users, (SELECT count(*) FROM sessions WHERE expires_at > strftime('%s','now')*1000) AS active_sessions, (SELECT count(*) FROM user_state) AS synced_states, (SELECT max(version) FROM user_state) AS max_version, (SELECT max(length(json)) FROM user_state) AS largest_state_bytes, (SELECT datetime(max(updated_at)/1000,'unixepoch') FROM user_state) AS last_sync_utc, (SELECT count(*) FROM profiles) AS profiles, (SELECT count(*) FROM health_daily) AS health_days" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(JSON.stringify(j[0].results[0]))})"
